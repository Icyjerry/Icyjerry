<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Jiarui Hu — Project Field Notes</title>
  <desc id="desc">A dark blueprint banner with glowing nodes for vision, worlds, and ideas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081421"/><stop offset="0.55" stop-color="#102039"/><stop offset="1" stop-color="#18273e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ef0d1"/><stop offset="0.55" stop-color="#64d7e5"/><stop offset="1" stop-color="#f6b76b"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#46c7d3" stop-opacity="0.22"/><stop offset="1" stop-color="#46c7d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8da4bb" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <circle cx="958" cy="189" r="252" fill="url(#halo)"/>
  <path d="M28 28H1172V352H28Z" fill="none" stroke="#9cb4c8" stroke-opacity="0.22"/>
  <path d="M66 73H121" stroke="#8ef0d1" stroke-width="4" stroke-linecap="round"/>
  <text x="136" y="79" fill="#96aec1" font-family="Menlo, monospace" font-size="17" letter-spacing="3">PROJECT FIELD NOTES / 001</text>
  <text x="66" y="183" fill="#f7fafc" font-family="Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">Jiarui Hu</text>
  <rect x="66" y="207" width="568" height="4" rx="2" fill="url(#accent)"/>
  <text x="66" y="256" fill="#d3e0e8" font-family="Arial, sans-serif" font-size="25">Build things. Understand them. Explain them.</text>
  <text x="66" y="313" fill="#9bb3c3" font-family="Menlo, monospace" font-size="18" letter-spacing="1">AI  /  INTERACTIVE WORLDS  /  VISUAL LEARNING</text>
  <circle cx="952" cy="188" r="120" fill="none" stroke="#9fc3d2" stroke-opacity="0.26" stroke-width="1.5" stroke-dasharray="5 9"/>
  <circle cx="952" cy="188" r="70" fill="none" stroke="#9fc3d2" stroke-opacity="0.18" stroke-width="1.5"/>
  <path d="M858 114L1038 103L1058 274L840 265Z" fill="none" stroke="#80d8d6" stroke-opacity="0.48" stroke-width="2"/>
  <path d="M858 114L952 188L1038 103M952 188L1058 274M952 188L840 265" fill="none" stroke="#8cd4da" stroke-opacity="0.36" stroke-width="1.5"/>
  <circle cx="952" cy="188" r="28" fill="#173e51" stroke="#8ef0d1" stroke-width="2" filter="url(#glow)"/>
  <circle cx="952" cy="188" r="8" fill="#b7ffe7"/>
  <circle cx="858" cy="114" r="12" fill="#83e8cf" filter="url(#glow)"/>
  <circle cx="1038" cy="103" r="12" fill="#68d7e8" filter="url(#glow)"/>
  <circle cx="1058" cy="274" r="12" fill="#f6b76b" filter="url(#glow)"/>
  <circle cx="840" cy="265" r="7" fill="#aac2d1"/>
  <text x="808" y="95" fill="#bcefe1" font-family="Menlo, monospace" font-size="14" letter-spacing="2">VISION</text>
  <text x="1048" y="84" fill="#a7e9ef" font-family="Menlo, monospace" font-size="14" letter-spacing="2">WORLDS</text>
  <text x="1071" y="300" fill="#f7d5aa" font-family="Menlo, monospace" font-size="14" letter-spacing="2">IDEAS</text>
</svg>
