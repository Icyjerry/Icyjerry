<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title">
<title id="title">Learning map: systems foundations → neural networks → Transformers → training → post-training → AI systems. A direction of study, not a completion chart.</title>
<style>
text {font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#24292f}
.small {font-size:13px;fill:#59636e} .label {font-size:15px} .accent {fill:#966017}
.flow {stroke-dasharray:3 13;animation:flow 5s linear infinite}
.cursor {animation:blink 1.4s steps(2,end) infinite}
@keyframes flow {to {stroke-dashoffset:-64}}
@keyframes blink {50% {opacity:0}}
@media (prefers-reduced-motion:reduce) {.flow,.cursor {animation:none}}
</style>
<rect x=".5" y=".5" width="959" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="28" y="33" class="small">LEARNING MAP</text><text x="932" y="33" class="small" text-anchor="end">keep asking what happens underneath</text><path d="M28 103H932" stroke="#d0d7de" opacity=".65"/><path d="M43 83V123" stroke="#d0d7de"/><path d="M43 83V123" class="flow" stroke="#966017"/><circle cx="43" cy="75" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="79" text-anchor="middle" font-size="11" class="accent">01</text><text x="72" y="80" font-size="17" font-weight="600">Foundations</text><text x="298" y="73" class="label">CS61A / B / C · CS170 · CSAPP</text><text x="298" y="93" class="small">programs, algorithms, memory</text><path d="M28 159H932" stroke="#d0d7de" opacity=".65"/><path d="M43 139V179" stroke="#d0d7de"/><path d="M43 139V179" class="flow" stroke="#966017"/><circle cx="43" cy="131" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="135" text-anchor="middle" font-size="11" class="accent">02</text><text x="72" y="136" font-size="17" font-weight="600">Neural networks</text><text x="298" y="129" class="label">micrograd · makemore</text><text x="298" y="149" class="small">gradients, one operation at a time</text><path d="M28 215H932" stroke="#d0d7de" opacity=".65"/><path d="M43 195V235" stroke="#d0d7de"/><path d="M43 195V235" class="flow" stroke="#966017"/><circle cx="43" cy="187" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="191" text-anchor="middle" font-size="11" class="accent">03</text><text x="72" y="192" font-size="17" font-weight="600">Transformers</text><text x="298" y="185" class="label">GPT / nanoGPT · BPE</text><text x="298" y="205" class="small">tokens → attention → logits</text><path d="M28 271H932" stroke="#d0d7de" opacity=".65"/><path d="M43 251V291" stroke="#d0d7de"/><path d="M43 251V291" class="flow" stroke="#966017"/><circle cx="43" cy="243" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="247" text-anchor="middle" font-size="11" class="accent">04</text><text x="72" y="248" font-size="17" font-weight="600">LLM training</text><text x="298" y="241" class="label">GPT-2 reproduction · PyTorch</text><text x="298" y="261" class="small">data, loss, optimization</text><path d="M28 327H932" stroke="#d0d7de" opacity=".65"/><path d="M43 307V347" stroke="#d0d7de"/><path d="M43 307V347" class="flow" stroke="#966017"/><circle cx="43" cy="299" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="303" text-anchor="middle" font-size="11" class="accent">05</text><text x="72" y="304" font-size="17" font-weight="600">Post-training</text><text x="298" y="297" class="label">fine-tuning · Hugging Face</text><text x="298" y="317" class="small">adapt a model; inspect its mistakes</text><path d="M28 383H932" stroke="#d0d7de" opacity=".65"/><circle cx="43" cy="355" r="13" fill="#f6f8fa" stroke="#d0d7de"/><text x="43" y="359" text-anchor="middle" font-size="11" class="accent">06</text><text x="72" y="360" font-size="17" font-weight="600">AI systems</text><text x="298" y="353" class="label">CS336 → inference / runtimes / infra</text><text x="298" y="373" class="small">next: how does it run efficiently?</text><text x="28" y="405" class="small">A direction of study — not a checklist of completed courses.</text></svg>
