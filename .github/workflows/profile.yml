name: Refresh profile cards
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Save updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub profile cards'
            for profile_attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            echo '::error::Could not publish profile cards after three attempts.'
            exit 1
          fi
